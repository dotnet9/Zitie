name: release

# 推送 v* 标签发布 Zitie 桌面安装包（与仓库自带 publish 脚本一致的产物布局）：
# win-x64 用 Inno Setup 生成 setup.exe（NativeAOT），linux-x64 生成 deb，
# linux-arm64 生成 zip，macOS 生成 dmg（发布由 scripts/publish_demo.ps1 完成，本工作流只做打包）。
# 全平台（win/linux/macOS）统一 NativeAOT（完整反射元数据保全，单线程 ILC）。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（不含 v），例如 0.1.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  test:
    name: 测试
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 测试
        run: dotnet test Zitie.slnx -c Release

  publish:
    name: 发布 ${{ matrix.rid }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-latest
          - rid: linux-arm64
            os: ubuntu-24.04-arm
          - rid: osx-x64
            os: macos-14
          - rid: osx-arm64
            os: macos-14
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: 安装 NativeAOT 依赖 (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 计算版本号
        id: version
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $version = '${{ inputs.version }}'.TrimStart('v', 'V')
          } else {
            $version = '${{ github.ref_name }}'.TrimStart('v', 'V')
          }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "版本：$version"

      # 仓库自带发布脚本：全平台 NativeAOT，并打包模板模块
      - name: 发布（scripts/publish_demo.ps1）
        shell: pwsh
        run: pwsh scripts/publish_demo.ps1 -RuntimeIdentifier '${{ matrix.rid }}'

      - name: 打包 Linux deb + sha256
        if: matrix.rid == 'linux-x64'
        shell: pwsh
        run: pwsh scripts/package_linux_deb.ps1 -Version $env:APP_VERSION -Force

      - name: 打包 Linux deb 安装包 (linux-arm64)
        if: matrix.rid == 'linux-arm64'
        shell: pwsh
        run: pwsh scripts/package_linux_deb.ps1 -RuntimeIdentifier 'linux-arm64' -Version $env:APP_VERSION -SourceDirectory 'artifacts/publish/linux-arm64/Zitie.Desktop' -Force

      - name: 打包 macOS dmg
        if: startsWith(matrix.rid, 'osx-')
        shell: bash
        run: |
          chmod +x scripts/package_macos.sh
          ./scripts/package_macos.sh ${{ matrix.rid }}

      - name: 构建 Windows 安装包
        if: matrix.rid == 'win-x64'
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: scripts/Zitie.iss
          options: >-
            /DAppVersion=${{ env.APP_VERSION }}
            /DSourceDir=${{ github.workspace }}\artifacts\publish\win-x64\Zitie.Desktop
            /DOutputDir=${{ github.workspace }}\artifacts\release

      - name: 计算安装包 SHA-256
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $installerName = "Zitie-v$env:APP_VERSION-win-x64-setup.exe"
          $installerPath = Join-Path "artifacts/release" $installerName
          if (-not (Test-Path -LiteralPath $installerPath -PathType Leaf)) {
            throw "Installer was not produced: $installerPath"
          }
          $sha = (Get-FileHash -LiteralPath $installerPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha  $installerName" | Set-Content -LiteralPath "$installerPath.sha256" -Encoding ASCII

      - name: 收集 macOS dmg 到发布目录
        if: startsWith(matrix.rid, 'osx-')
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts/release -Force | Out-Null
          # hdiutil 刚 detach 时文件系统可见性可能滞后：轮询等待 dmg 出现且非空
          $deadline = (Get-Date).AddSeconds(60)
          do {
            $dmgs = @(Get-ChildItem -Path artifacts/macos -Filter *.dmg -File -ErrorAction SilentlyContinue |
              Where-Object Length -gt 0)
            if ($dmgs.Count -gt 0) { break }
            Start-Sleep -Seconds 3
          } while ((Get-Date) -lt $deadline)
          if ($dmgs.Count -eq 0) { throw "No dmg found under artifacts/macos" }
          foreach ($d in $dmgs) {
            Copy-Item -LiteralPath $d.FullName -Destination "artifacts/release/$($d.Name)" -Force
          }
          $copied = @(Get-ChildItem artifacts/release -Filter *.dmg -File)
          if ($copied.Count -eq 0) { throw "Copy produced no files" }
          $copied | ForEach-Object { Write-Host $_.Name }

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: Zitie-${{ matrix.rid }}
          path: artifacts/release/*
          if-no-files-found: error

  release:
    name: 创建 GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          pattern: Zitie-*
          path: artifacts/release
          merge-multiple: true

      - name: 计算版本号
        id: version
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $version = '${{ inputs.version }}'.TrimStart('v', 'V')
            $tagName = "v$version"
          } else {
            # 沿用被推送的原始标签，避免额外创建新标签。
            $tagName = '${{ github.ref_name }}'
            $version = $tagName.TrimStart('v', 'V')
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag_name=$tagName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: 准备发布说明
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG_NAME: ${{ steps.version.outputs.tag_name }}
        run: |
          # 优先使用手工维护的版本说明，否则退回简单的版本标题
          $curated = ".github/release-notes/v$env:VERSION.md"
          $bodyPath = "artifacts/release-body.md"
          New-Item -ItemType Directory -Path (Split-Path -Parent $bodyPath) -Force | Out-Null
          if (Test-Path -LiteralPath $curated -PathType Leaf) {
            Copy-Item -LiteralPath $curated -Destination $bodyPath -Force
            Write-Host "使用发布说明：$curated"
          }
                    # 附注 tag 的说明就是发布说明（Release 页直接可读，不点开 tag 也能看到）
                    git fetch -f origin "refs/tags/$env:TAG_NAME" 2>$null | Out-Null
                    $tagMessage = git tag -l "$env:TAG_NAME" --format='%(contents)'
                    if (-not [string]::IsNullOrWhiteSpace($tagMessage)) {
                      $tagMessage | Set-Content -LiteralPath $bodyPath -Encoding utf8
                      Write-Host "使用附注 tag 说明作为发布说明。"
                    }
                    else {
        
            "Zitie v$env:VERSION" | Set-Content -LiteralPath $bodyPath -Encoding utf8
            Write-Host "未找到 $curated，将只使用自动生成的变更说明。"
          }

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: Zitie v${{ steps.version.outputs.version }}
          body_path: artifacts/release-body.md
          generate_release_notes: true
          files: |
            artifacts/release/*.exe
            artifacts/release/*.deb
            artifacts/release/*.dmg
            artifacts/release/*.zip
            artifacts/release/*.sha256
